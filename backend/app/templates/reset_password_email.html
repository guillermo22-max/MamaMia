<!doctype html>
<html lang="es">
  <body style="margin:0;background:#fff7ed;font-family:Arial,Helvetica,sans-serif;color:#1c1917;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#fff7ed;padding:32px 16px;">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:560px;background:#ffffff;border-radius:28px;border:1px solid #fed7aa;overflow:hidden;">
            <tr>
              <td style="padding:28px 28px 18px;">
                <img src="cid:{logo_cid}" width="64" height="64" alt="MamaMia" style="display:block;border-radius:18px;margin:0 0 14px;">
                <div style="font-weight:900;font-size:22px;color:#f97316;">MamaMia</div>
                <h1 style="margin:24px 0 10px;font-size:28px;line-height:1.15;color:#111827;">Restablece tu contrasena</h1>
                <p style="margin:0;color:#57534e;font-size:16px;line-height:1.6;">Hola {name}, recibimos una solicitud para cambiar la contrasena de tu cuenta.</p>
              </td>
            </tr>
            <tr>
              <td style="padding:0 28px 28px;">
                <a href="{reset_url}" style="display:inline-block;background:#f97316;color:#ffffff;text-decoration:none;border-radius:999px;padding:14px 22px;font-weight:900;">Crear nueva contrasena</a>
                <p style="margin:22px 0 0;color:#78716c;font-size:14px;line-height:1.6;">Este enlace vence pronto. Si no pediste este cambio, puedes ignorar este correo y tu contrasena seguira igual.</p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
