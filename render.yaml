databases:
  - name: mamamia-db
    databaseName: mamamia
    plan: free

services:
  - type: web
    name: mamamia-backend
    runtime: docker
    plan: free
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    envVars:
      - key: APP_NAME
        value: MamaMia API
      - key: DATABASE_URL
        fromDatabase:
          name: mamamia-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "1440"
      - key: CORS_ORIGINS
        value: https://mamamia-frontend.onrender.com
      - key: TRUSTED_HOSTS
        value: mamamia-backend.onrender.com
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_RECIPE_MODEL
        value: gpt-4o-mini
      - key: OPENAI_IMAGE_MODEL
        value: gpt-image-1-mini
      - key: FRONTEND_URL
        value: https://mamamia-frontend.onrender.com
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM_EMAIL
        value: adminrecipesai@gmail.com
      - key: SMTP_FROM_NAME
        value: MamaMia
      - key: SMTP_USE_TLS
        value: "true"
      - key: PASSWORD_RESET_EXPIRE_MINUTES
        value: "60"

  - type: web
    name: mamamia-frontend
    runtime: docker
    plan: free
    dockerContext: ./frontend
    dockerfilePath: ./frontend/Dockerfile
    envVars:
      - key: VITE_API_URL
        value: https://mamamia-backend.onrender.com
